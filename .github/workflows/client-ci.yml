name: Loveraf App and Admin CI

on:
  push:
    paths:
      - "Loverap-app/**"
      - "admin/**"
      - ".github/workflows/client-ci.yml"
  pull_request:
    paths:
      - "Loverap-app/**"
      - "admin/**"
      - ".github/workflows/client-ci.yml"

permissions:
  contents: read

jobs:
  admin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm run build

  android-release-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: Loverap-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Loverap-app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - run: npm ci
      - name: Typecheck, lint and unit tests
        run: npm run verify
      - name: Create disposable CI signing key
        run: keytool -genkeypair -storetype PKCS12 -keystore "$RUNNER_TEMP/loveraf-ci.p12" -storepass ci-validation-only -alias loveraf-ci -keypass ci-validation-only -keyalg RSA -keysize 2048 -validity 1 -dname "CN=Loveraf CI"
      - name: Build release APK against the HTTPS production API
        env:
          LOVERAF_UPLOAD_STORE_FILE: ${{ runner.temp }}/loveraf-ci.p12
          LOVERAF_UPLOAD_STORE_PASSWORD: ci-validation-only
          LOVERAF_UPLOAD_KEY_ALIAS: loveraf-ci
          LOVERAF_UPLOAD_KEY_PASSWORD: ci-validation-only
        run: chmod +x android/gradlew && cd android && ./gradlew app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: loveraf-ci-release-apk-not-for-distribution
          path: Loverap-app/android/app/build/outputs/apk/release/*.apk
          retention-days: 3
